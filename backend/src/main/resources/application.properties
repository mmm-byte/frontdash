# ==========================================
# Food Delivery Backend Configuration
# ==========================================

# Server Configuration
server.port=${PORT:8080}
spring.application.name=food-delivery-backend
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/food_delivery_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Clear Hibernate caches
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# Disable default Spring Security (we'll handle auth manually)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Logging Configuration
logging.level.com.fooddelivery=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

# Error Handling
server.error.include-message=always
server.error.include-binding-errors=always
